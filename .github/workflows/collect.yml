name: collect
on:
  schedule:
    - cron: "0 2 * * *"      # daily 02:00 UTC (10:00 MYT)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-collector.txt }
      - run: pip install -r requirements-collector.txt -r requirements.txt httpx
      - run: python -m pytest -q tests
      - run: python -m collector discover
      - run: python -m collector fetch --recheck-days 30
      - run: python -m collector stats
      - name: Commit catalogue (Vercel redeploys on push)
        run: |
          git config user.name "sc-regdocs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalogue.json
          git diff --cached --quiet || (git commit -m "chore: update SC catalogue" && git push)
